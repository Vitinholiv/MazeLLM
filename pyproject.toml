[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maze_llm"
version = "1.0.0"
description = "LLM Preditora de Labirintos"
authors = [
    { name = "Paulo Vitor Correia de Oliveira" }
]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "tqdm",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]